# 購読する RSS の一覧。
#
# このファイルの編集だけでフィードを増減できること。コード変更を伴わせないこと。
#
# ─────────────────────────────────────────────────────────────────────────
# 疎通確認: 2026-08-13 に Raspberry Pi 上で 8 件すべて OK。
#           全フィードがタイムゾーン付きの日時を返していた（TZ 無し・日時欠けは 0 件）。
#
# 購読先を足したり、しばらく運用したあとで確認するときは:
#
#     python3 -m collectors.feeds --check
#
# 各フィードの HTTP ステータス / パース可否 / 24 時間以内の件数 / limit による
# 切り捨ての有無 / 日時のタイムゾーンの有無が表で出ます。
# 失敗が 1 つでもあれば終了コードは 1 です。
#
# 取得した内容をそのまま fixture として保存しておくと、以後ネットワークなしで
# 収集ロジックを検証できます:
#
#     python3 -m collectors.feeds --check --save-fixtures tests/fixtures
# ─────────────────────────────────────────────────────────────────────────

# 「有料だったものが無料になった／配布される」を表す語。
# ゲーム欄では除外し、無料配布欄では抽出条件に使う。1 箇所で管理するため
# YAML のアンカーにしてある（& が定義、* が参照）。
# 判定は全角半角と大文字小文字を無視した部分一致。
free_game_words: &free_game_words
  - 無料配布
  - 無料化
  - 無料入手
  - 無料プレゼント
  - 期間限定無料
  - 0円          # Game*Spark の【2,950円→0円】形式に効く
  - フリープレイ   # PS Plus のフリープレイ

# ゲーム欄で埋まりがちな、スマホゲームの運営更新を表す語。
# 「発売・開発・大型アップデートの情報だけ欲しい」という要望に対する対処。
#
# あえて控えめにしてある。取りこぼしより誤爆の方が困るため、本物のニュースにも
# 使われる語（復刻・ピックアップ・コラボ・周年）は入れていない。
#   「復刻」   → レトロゲームの復刻版発売
#   「ピックアップ」→ 4Gamer の「注目タイトルをピックアップ」
# 埋まるようなら足してください。1 行増やすだけです。
game_noise_words: &game_noise_words
  - ガチャ
  - ログインボーナス
  - ログボ
  - 出現率
  - 排出率
  - 開催記念キャンペーン

defaults:
  window_hours: 24                # generated_at から遡る時間。これより古い記事は捨てる
  timeout: 15                      # 1 フィードあたりの取得タイムアウト(秒)
  per_feed_limit: 10               # 1 フィードから採用する最大件数
  host_delay: 1.0                  # 同一ホストへの連続アクセスの最小間隔(秒)
  assume_timezone: Asia/Tokyo      # タイムゾーンを持たない日時をどう解釈するか
  user_agent: "daily-digest/0.1 (+RSS reader for personal use)"

# セクションの並びがそのまま digest.json の並びになる。
# id / title / emoji は digest.json のセクションと同じ意味・同じ名前。
# type は links 固定なので書かない（feeds.py が付ける）。
#
# フィードの並びは「優先度」でもある。異なる媒体が同じ記事を配信した場合、
# 先に宣言したフィード側を残す。一次情報を上に置くこと。
#
# 各フィードで指定できる任意キー:
#   limit               defaults.per_feed_limit の上書き
#   enabled             false で一時的に無効化（行を消さずに外せる）
#   timeout             defaults.timeout の上書き
#   assume_timezone     defaults.assume_timezone の上書き
#   strip_title_suffix  重複判定の際、タイトル末尾の " - 媒体名" を無視する
sections:
  - id: news
    title: 時事ニュース
    emoji: "📰"
    feeds:
      # 一次情報を先に置く。Google News が同じ記事を配信した場合こちらが残る。
      # このフィードは全体で 7 件程度しか無いので limit は効かない
      - name: NHK 主要
        url: https://www.nhk.or.jp/rss/news/cat0.xml

      # ⚠ ここから 2 件は未検証。--check で確認すること。
      #   NG だったら --probe でその媒体のトップページを調べ直せます:
      #       python3 -m collectors.feeds --probe https://news.yahoo.co.jp/
      #
      # NHK 1 本だと、NHK が落ちた日に時事欄が丸ごと空になる。
      # 「各所から拾って世間に取り残されないように」という要望への対処も兼ねて
      # 別系統の媒体を足す。Yahoo! のトピックスは編集部が選んだ「いま世間で
      # 話題になっているもの」なので、この用途と相性がいい
      - name: Yahoo!ニュース
        url: https://news.yahoo.co.jp/rss/topics/top-picks.xml
        limit: 5
      - name: 朝日新聞
        url: https://www.asahi.com/rss/asahi/newsheadlines.rdf
        limit: 5

      # 2026-08-13 に無効化。実運用で 2 つ問題が出たため:
      #   1. 運んでくる記事がほぼ NHK と重複していた。しかも NHK 側が見出しを
      #      更新すると（「18市」→「20自治体」）重複と判定できずに二重掲載される
      #   2. リンクが news.google.com の中継 URL で、開くと 1 回余計な通信が入る。
      #      電車内のオフライン閲覧という用途と相性が悪い
      # 一次情報を直接引く方針にする。復活させるなら enabled を外すだけ
      - name: Google News
        url: "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja"
        enabled: false
        limit: 5
        strip_title_suffix: true

  # Steam / Epic などで「有料だったものが無料になった・配布される」情報だけを集める欄。
  # 基本プレイ無料のゲームは山ほどあって切りが無いので、それは拾わない。
  #
  # 情報源はゲーム欄と同じ 3 つ。国内のゲームメディアはこの手のニュースを
  # よく拾うので、新しい購読先を足すより確実。取得は 1 回で共有される。
  #
  # ゲーム欄より先に宣言しているのが重要。ここで拾われた記事は重複排除で
  # ゲーム欄から自動的に消える（先に宣言した方が勝つ）。逆にここで弾かれた
  # 記事はゲーム欄に流れるので、どちらからも消える事故が起きない。
  - id: freegame
    title: 無料配布
    emoji: "🆓"
    include: *free_game_words
    exclude:
      # 「基本プレイ無料化」は上の 無料化 に引っかかるが、これは対象外。
      # 弾かれた記事はゲーム欄に出る
      - 基本プレイ無料
      - 基本無料
      - 無料体験
      - 無料アップデート
    feeds: &game_feeds
      - name: 4Gamer
        url: https://www.4gamer.net/rss/index.xml
      - name: AUTOMATON
        url: https://automaton-media.com/feed/
      - name: Game*Spark
        url: https://www.gamespark.jp/rss20/index.rdf
      # ⚠ 未検証。開発者インタビューや制作の話が多い媒体なので
      #   「開発情報も欲しい」という要望に合う
      - name: 電ファミニコゲーマー
        url: https://news.denfaminicogamer.jp/feed
        limit: 5

  - id: game
    title: ゲーム
    emoji: "🎮"
    # スマホゲームの運営更新でこの欄が埋まるのを防ぐ
    exclude: *game_noise_words
    feeds: *game_feeds

  - id: ai
    title: AI
    emoji: "🤖"
    # この欄は AI の話だけにする。
    #
    # 情報源（GIGAZINE・はてブ・Hacker News）はどれも扱う範囲が広く、
    # このキーワードが無いと松屋の試食レビューや海底ケーブルの記事まで並ぶ。
    #
    # 英数字のキーワードは単語として一致する（部分一致ではない）ので、
    # "ai" が email や available に誤爆することはない。日本語は部分一致。
    #
    # 取りこぼしはある。「Transformer の新手法」のようにこの語を 1 つも
    # 含まない記事は落ちる。そこは将来ローカル LLM に任せる部分
    include:
      - AI
      - LLM
      - 生成AI
      - 機械学習
      - ディープラーニング
      - 深層学習
      - ニューラル
      - 大規模言語モデル
      - ChatGPT
      - GPT
      - Claude
      - Anthropic
      - OpenAI
      - Gemini
      - Copilot
      - DeepSeek
      - Llama
      - Qwen
      - Mistral
      - Hugging Face
      - Stable Diffusion
      - 画像生成
      - プロンプト
      - RAG
      - ファインチューニング
      - 推論モデル
      - NVIDIA
    feeds:
      # 日本語の媒体を先に置く。「英語だと分かりづらい」という要望への対処で、
      # 同じ話題を両方が扱った場合は日本語側が残る（先に宣言した方が勝つ）。
      #
      # ⚠ ここから 2 件は未検証。--check で確認すること
      - name: ITmedia AI+
        url: https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
        limit: 5
      - name: Publickey
        url: https://www.publickey1.jp/atom.xml
        limit: 5

      - name: はてブ テクノロジー
        url: https://b.hatena.ne.jp/hotentry/it.rss

      # 作者が手で足していたもの。git の競合で一度消したので正式に入れ直した。
      # 扱う範囲が広く（ガジェット・科学・食べ物まで）件数も多い媒体なので
      # limit を絞ってある。別の欄の方が合うなら 3 行動かすだけ
      - name: GIGAZINE
        url: https://gigazine.net/news/rss_2.0/
        limit: 3

      # news.ycombinator.com/rss は pubDate を持たない。日時が付く hnrss を使う。
      # frontpage をそのまま入れると AI と無関係な技術ニュースが大半を占めたため、
      # 2026-08-13 に検索クエリ付きへ変更した。
      # --check で 24h内 が 0 件に近ければ points を下げるか消すこと
      # 唯一の英語ソース。和訳できるようになるまでは件数を絞っておく。
      # 全部日本語にしたければ enabled: false で外せる
      - name: Hacker News
        url: "https://hnrss.org/newest?q=AI&points=50"
        limit: 3
        assume_timezone: UTC

      # 2026-08-13 に無効化。1 日 306 件のうち先頭 5 件を取るだけで、
      # その 5 件は注目度順でも関連度順でもない実質ランダムだった。
      # さらに投稿時刻が古いため、時刻順に並べると Discord の上位 6 件に一度も
      # 顔を出せていなかった。絞り込みの当てが付いたら復活させる
      - name: arXiv cs.AI
        url: https://export.arxiv.org/rss/cs.AI
        enabled: false
        limit: 5
        assume_timezone: UTC
