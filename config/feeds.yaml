# 購読する RSS の一覧。
#
# このファイルの編集だけでフィードを増減できること。コード変更を伴わせないこと。
#
# ─────────────────────────────────────────────────────────────────────────
# 疎通確認: 2026-08-13 に Raspberry Pi 上で 8 件すべて OK。
#           全フィードがタイムゾーン付きの日時を返していた（TZ 無し・日時欠けは 0 件）。
#
# 購読先を足したり、しばらく運用したあとで確認するときは:
#
#     python3 -m collectors.feeds --check
#
# 各フィードの HTTP ステータス / パース可否 / 24 時間以内の件数 / limit による
# 切り捨ての有無 / 日時のタイムゾーンの有無が表で出ます。
# 失敗が 1 つでもあれば終了コードは 1 です。
#
# 取得した内容をそのまま fixture として保存しておくと、以後ネットワークなしで
# 収集ロジックを検証できます:
#
#     python3 -m collectors.feeds --check --save-fixtures tests/fixtures
# ─────────────────────────────────────────────────────────────────────────

defaults:
  window_hours: 24                 # generated_at から遡る時間。これより古い記事は捨てる
  timeout: 15                      # 1 フィードあたりの取得タイムアウト(秒)
  per_feed_limit: 10               # 1 フィードから採用する最大件数
  host_delay: 1.0                  # 同一ホストへの連続アクセスの最小間隔(秒)
  assume_timezone: Asia/Tokyo      # タイムゾーンを持たない日時をどう解釈するか
  user_agent: "daily-digest/0.1 (+RSS reader for personal use)"

# セクションの並びがそのまま digest.json の並びになる。
# id / title / emoji は digest.json のセクションと同じ意味・同じ名前。
# type は links 固定なので書かない（feeds.py が付ける）。
#
# フィードの並びは「優先度」でもある。異なる媒体が同じ記事を配信した場合、
# 先に宣言したフィード側を残す。一次情報を上に置くこと。
#
# 各フィードで指定できる任意キー:
#   limit               defaults.per_feed_limit の上書き
#   enabled             false で一時的に無効化（行を消さずに外せる）
#   timeout             defaults.timeout の上書き
#   assume_timezone     defaults.assume_timezone の上書き
#   strip_title_suffix  重複判定の際、タイトル末尾の " - 媒体名" を無視する
sections:
  - id: news
    title: 時事ニュース
    emoji: "📰"
    feeds:
      # 一次情報を先に置く。Google News が同じ記事を配信した場合こちらが残る。
      # このフィードは全体で 7 件程度しか無いので limit は効かない
      - name: NHK 主要
        url: https://www.nhk.or.jp/rss/news/cat0.xml
      # 2026-08-13 に無効化。実運用で 2 つ問題が出たため:
      #   1. 運んでくる記事がほぼ NHK と重複していた。しかも NHK 側が見出しを
      #      更新すると（「18市」→「20自治体」）重複と判定できずに二重掲載される
      #   2. リンクが news.google.com の中継 URL で、開くと 1 回余計な通信が入る。
      #      電車内のオフライン閲覧という用途と相性が悪い
      # 一次情報を直接引く方針にする。復活させるなら enabled を外すだけ
      - name: Google News
        url: "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja"
        enabled: false
        limit: 5
        strip_title_suffix: true

  - id: game
    title: ゲーム
    emoji: "🎮"
    feeds:
      - name: 4Gamer
        url: https://www.4gamer.net/rss/index.xml
      - name: AUTOMATON
        url: https://automaton-media.com/feed/
      - name: Game*Spark
        url: https://www.gamespark.jp/rss20/index.rdf

  - id: ai
    title: AI
    emoji: "🤖"
    feeds:
      # news.ycombinator.com/rss は pubDate を持たない。日時が付く hnrss を使う。
      # frontpage をそのまま入れると AI と無関係な技術ニュースが大半を占めたため、
      # 2026-08-13 に検索クエリ付きへ変更した。
      # --check で 24h内 が 0 件に近ければ points を下げるか消すこと
      - name: Hacker News
        url: "https://hnrss.org/newest?q=AI&points=50"
        limit: 5
        assume_timezone: UTC
      - name: はてブ テクノロジー
        url: https://b.hatena.ne.jp/hotentry/it.rss

      # 2026-08-13 に無効化。1 日 306 件のうち先頭 5 件を取るだけで、
      # その 5 件は注目度順でも関連度順でもない実質ランダムだった。
      # さらに投稿時刻が古いため、時刻順に並べると Discord の上位 6 件に一度も
      # 顔を出せていなかった。絞り込みの当てが付いたら復活させる
      - name: arXiv cs.AI
        url: https://export.arxiv.org/rss/cs.AI
        enabled: false
        limit: 5
        assume_timezone: UTC
