# ローカル LLM による選別と和訳の設定。
#
# この工程は「あれば効く、無くても困らない」もの。Ollama が動いていなければ
# 丸ごと飛ばして、収集したままの結果で配信する。
#
# 動作確認:
#     python3 -m curator.llm --check                     # Ollama とモデルの疎通
#     python3 -m curator.llm data/digest.json --dry-run  # LLM を呼ばずに送る内容を見る
#     python3 -m curator.llm data/digest.json            # 実際に選別して結果を見る
#
# プロンプトを変えたら 3 つ目で試すこと。run_daily.py を通さずに何度でも試せる。

defaults:
  # 接続先。.env の CURATOR_URL / CURATOR_MODEL があればそちらが優先される
  base_url: http://localhost:11434
  model: qwen2.5:1.5b

  timeout: 180        # 1 リクエストあたりの上限(秒)
  # 選別全体の上限(秒)。超えたら残りは選別せず、取れた分をそのまま配信する。
  # ⚠ ここを上げたら deploy/daily-digest.service の TimeoutStartSec も上げること。
  #   あちらが短いと、切り上げる前に systemd がプロセスごと殺す。
  total_budget: 1800
  chunk_size: 12      # 一度に見せる見出しの数。小さいモデルほど少ない方が正確

  # モデルに渡す文脈の広さ。ここは確保されるメモリ量に直結する。
  # 実際に使うのは例 8 件込みで 400 トークン程度なので 4096 は無駄が大きく、
  # メモリ 3.7GB の Pi で 3B を動かすときはこの差が効く。
  # 例を増やして溢れたら（答えが急に変になったら）ここを 4096 に戻すこと
  num_ctx: 2048
  temperature: 0      # 毎朝同じ入力なら同じ結果が出るように
  keep_alive: 5m      # 処理中モデルをメモリに保持する時間。処理後は明示的に解放する

  # 1 件ずつ判定するときの聞き方。小さいモデルはこれで答えが丸ごと変わる。
  #     python3 -m curator.llm --selftest
  # で答えの分かっている見出し 20 件を使って採点できる。勝ったものをここに書く。
  #
  #   category         分野を 10 個並べて 1 つ選ばせる
  #   english_fewshot  英語で指示 + 正解例。keep / discard で答えさせる
  #   english          英語で指示。例なし
  #   fewshot          日本語で指示 + 正解例
  #   yes_no           日本語・例なし・「はい」「いいえ」
  #   keep_true        日本語・例なし・JSON
  #   score            日本語・例なし・0〜10 の点数
  #
  # 2026-08-16 に qwen2.5:1.5b で実測（20 件、7〜8 秒/件）:
  #   category         18/20  ← 採用。偶然にこうなる確率 0.02%
  #   english_fewshot  10/20  当てずっぽうと同じ
  #   english          10/20  20 件すべて discard
  #   fewshot          10/20  20 件すべて はい
  #
  # 二択にすると、日本語でも英語でも、例のありなしにも関係なく片側に倒れる。
  # 選択肢を 10 個にした途端に見出しを読み始めた。モデルの能力ではなく
  # 聞き方の問題だったということ。聞き方を変えるときは必ず --selftest で測ること。
  judge_style: category

# ─────────────────────────────────────────────────────────────────────────
# judge_style: category のとき、精度を決めるのは categories。
#
# 「読みたい分野」と「読みたくない分野」を並べて 1 つ選ばせ、選んだ分野が
# どちら側かで決める。二択（当てはまりますか→はい/いいえ）だと 1.5B は
# 片側に倒れて 20 件すべて同じ答えになるが、選択肢が 10 個あると倒れられない。
#
# 調整のしかた: 配信を見て「これいらない」と思った見出しが出たら、
#     python3 -m curator.llm data/digest.json --explain
# でモデルが何の分野と答えたかを見る。想定と違う分野を答えているなら、
# その分野名を drop に足すか、分かりやすい名前に言い換える。
#
# keep と drop は同じ数にすること。片方が多いと、迷ったとき多い方に寄る。
# 「その他」のような何でも入る名前は drop に置かないこと。判断を投げた
# ものが全部そこへ落ちて消える。
#
# ─────────────────────────────────────────────────────────────────────────
# 以下の examples は fewshot 系の聞き方が使う。category では使われないが、
# 聞き方を戻したときのために残してある。
#
# criteria は「政治、経済、災害」のような抽象的な指示で、小さいモデルは
# これをうまく使えない。実測では criteria だけで聞くと、70 件すべてに
# 同じ答えを返した（keep_true は全部「捨てる」、score は全部「残す」）。
#
# examples は正解例そのもの。「この見出しは残す、これは捨てる」を並べてから
# 同じ形式で答えさせる。モデルは判断するより形をなぞる方が得意なので、
# こちらの方がはるかによく効く。
#
# 使い方: 配信を見て「これいらない」と思った見出しを drop に、
#         「これは欲しかったのに落ちた」を keep に足す。1 行足すだけ。
#
# keep と drop は同じくらいの数にすること。片方に偏ると、
# モデルは中身を見ずに多い方の答えを返すようになる。
#
# min_keep は減りすぎたときの安全弁。判定で下回ったら新しい順に戻す。
# ─────────────────────────────────────────────────────────────────────────

# 選別したいセクションだけ書く。書いていないセクションは素通しする。
# id は feeds.yaml のセクション id と同じ。
sections:
  news:
    select:
      keep: 6
      min_keep: 4
      criteria: |
        政治、経済、災害、国際情勢、社会の大きな出来事。
      examples:
        keep:
          - 政府、半導体分野への追加投資を決定
          - 台風10号が九州に上陸 5万世帯が停電
          - 日銀 政策金利の引き上げを決定 市場の反応は
          - アフガニスタン タリバン復権から5年 人道状況の悪化懸念
        drop:
          - スマホ水没・水ぬれ時 NGな行為
          - 松屋の新メニューを実食レビュー 想像以上のボリューム
          - プロ野球 阪神が3連勝 首位との差を2に縮める
          - 猫が段ボールを好む理由を専門家が解説
      # judge_style: category のときに使う。答えた分野で残す・捨てるを決める
      categories:
        keep: [政治, 経済, 災害, 国際, 事件事故]
        drop: [生活, グルメ, 芸能, スポーツ, 雑学]

  game:
    select:
      keep: 8
      min_keep: 5
      criteria: |
        新作の発表、発売日や配信日、大型アップデート、開発者の話、
        ゲーム業界の動き。
      examples:
        keep:
          - 『新作RPG』2027年3月12日に発売決定 予約受付を開始
          - 「S.T.A.L.K.E.R. 2」，Update 2.0を8月20日にリリース。グラフィックスが刷新
          - PS5/PC大型ファンタジーARPG『ブリンガ』発表。高速戦闘と映画級アニメーション
          - ゲーム業界で「生成AI使用禁止」を盛り込む契約書、ここ1年で急増傾向との証言
        drop:
          - 「プロセカ」，楽曲「アヤノの幸福理論」がゲーム内に登場
          - 『プラグマタ』ディアナのTシャツが可愛すぎる。コラボアパレルが販売
          - 「HOT TOYS SUMMER 2026 SHOWCASE」，8月15日よりベルサール秋葉原にて開催
          - 『真・女神転生』ボードゲーム配送遅延の続報―製品パッケージも紹介
      # 2026-08-16 の実測で直したもの:
      #   「アニメや映像」がゲームの新作を吸っていた → ゲーム以外に限定
      #   「小さな更新」が業界ニュースを吸っていた → 廃止
      #   ゲーム以外の記事（コミケの呼び込み君）が「開発の話」に落ちていた
      #     → 受け皿として「ゲーム以外の話題」を追加
      categories:
        keep: [新作の発表, 発売日や配信日, 大型アップデート, 開発者の話, ゲーム業界の動き]
        drop: [グッズや物販, イベントの告知, 運営のお知らせ, ゲーム以外のアニメや漫画, ゲーム以外の話題]

  ai:
    select:
      keep: 8
      min_keep: 5
      criteria: |
        新しい AI モデルの発表、料金や性能の変化、ローカル LLM、
        実際に使える新機能、Claude や Anthropic の話題。
      examples:
        keep:
          - Google、「Gemini 3.7 Flash」公開 年内は半額の導入価格
          - AIエージェント同士が縄張り争い Anthropicがマルチエージェント実験の結果を公開
          - ChatGPTがPC操作を自動で記録、コンテキストとして利用可能に
          - Microsoft、画像生成AI「MAI-Image-2.6」を発表
        drop:
          - 夏祭りのポップやポスターをAIで作るの本当にやめた方がいい
          - シャドーAIは「禁止」ではなく運用設計で向き合う - Qiita
          - 左右対称で典型的な「AIっぽいきれいな顔」は買い物客を遠ざけてしまう可能性
          - ブラウザでPC-98が起動!! FreeDOS(98)同梱＆AI操作対応の「WebNP2」
      # この欄は feeds.yaml のキーワードで既に AI の話に絞ってあるので、
      # 捨てる側は「明らかに AI の話ではないもの」だけにしてある。
      # 「AI以外の技術」のような広い名前は、英語の見出しを軒並み吸っていた
      categories:
        keep: [新しいAIモデル, AIの料金や性能, ローカルLLM, AIの新機能, AI企業の発表]
        drop: [個人の感想, ネットで話題, 事件や裁判, 生活やグルメ, AIと関係ない話題]
    # 日本語でない見出しを訳す。訳せなかったものは原文のまま残す
    translate: true

  # 無料配布は元々少ないので選別しない（この欄を書かなければ素通し）
