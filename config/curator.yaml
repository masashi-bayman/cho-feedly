# ローカル LLM による選別と和訳の設定。
#
# この工程は「あれば効く、無くても困らない」もの。Ollama が動いていなければ
# 丸ごと飛ばして、収集したままの結果で配信する。
#
# 動作確認:
#     python3 -m curator.llm --check                     # Ollama とモデルの疎通
#     python3 -m curator.llm data/digest.json --dry-run  # LLM を呼ばずに送る内容を見る
#     python3 -m curator.llm data/digest.json            # 実際に選別して結果を見る
#
# プロンプトを変えたら 3 つ目で試すこと。run_daily.py を通さずに何度でも試せる。

defaults:
  # 接続先。.env の CURATOR_URL / CURATOR_MODEL があればそちらが優先される
  base_url: http://localhost:11434
  model: qwen2.5:1.5b

  timeout: 180        # 1 リクエストあたりの上限(秒)
  total_budget: 900   # 選別全体の上限(秒)。超えたら残りは選別せずそのまま通す
  chunk_size: 12      # 一度に見せる見出しの数。小さいモデルほど少ない方が正確
  num_ctx: 4096       # モデルに渡す文脈の広さ
  temperature: 0      # 毎朝同じ入力なら同じ結果が出るように
  keep_alive: 5m      # 処理中モデルをメモリに保持する時間。処理後は明示的に解放する

# criteria は短く書くこと。
# 1.5B のような小さいモデルは長い指示を読み切れず、条件を無視し始める。
# 実測でも、条件を長く書いた版では「グッズの配送遅延」「アニメの配信決定」が
# 残ってしまった。短くするほど精度と速度の両方が上がる。

# 選別したいセクションだけ書く。書いていないセクションは素通しする。
# id は feeds.yaml のセクション id と同じ。
sections:
  news:
    select:
      keep: 6
      criteria: |
        残す: 政治、経済、災害、国際情勢など、社会全体に関わる出来事。
        捨てる: 個別の事故や事件、芸能、スポーツの結果、地域の話題。

  game:
    select:
      keep: 8
      criteria: |
        残す: 新作の発表、発売日や配信日の決定、大型アップデート、開発者の話、
              ゲームエンジンの話。
        捨てる: 楽曲やキャラの追加、イベント告知、グッズや物販、アニメの話、
              大会の結果。

  ai:
    select:
      keep: 8
      criteria: |
        残す: 新しい AI モデルの発表、料金や性能の変化、ローカル LLM、
              実際に使える新機能。Claude と Anthropic の話題は必ず残す。
        捨てる: 感想や意見だけの記事、AI と関係の薄い話。
    # 日本語でない見出しを訳す。訳せなかったものは原文のまま残す
    translate: true

  # 無料配布は元々少ないので選別しない（この欄を書かなければ素通し）
