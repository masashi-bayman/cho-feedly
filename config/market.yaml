# 監視する銘柄・指数の一覧。
#
# このファイルの編集だけで増減できること。コード変更を伴わせないこと。
#
# ─────────────────────────────────────────────────────────────────────────
# 銘柄を足したり記号を変えたりしたら、必ず疎通を確認すること。
#
#     python3 -m collectors.market --check
#
# 1 銘柄が NG でも他の銘柄は普通に取得されます。慌てて直さなくて大丈夫です。
#
# 取得方法は source で決まります。
#     source: yahoo （既定）… symbol に記号を書く。指数・為替・株式・暗号資産
#     source: csv          … url に基準価額 CSV の場所を書く。国内の投資信託
# ─────────────────────────────────────────────────────────────────────────

defaults:
  timeout: 15
  host_delay: 1.0        # 同一ホストへの連続アクセスの最小間隔(秒)
  range: 5d              # 取得する日足の期間。前日比の計算に最低 2 営業日分が要る
  decimals: 2            # 表示の小数点以下桁数
  user_agent: "daily-digest/0.1 (+market watch for personal use)"

# digest.json のセクションヘッダになる。feeds.yaml のセクションと同じ意味
section:
  id: market
  title: マーケット
  emoji: "📈"

# 並びがそのまま Discord での並びになる。
# 各銘柄で指定できる任意キー: decimals / enabled / range / timeout
symbols:
  - name: 日経平均
    symbol: "^N225"

  - name: S&P500
    symbol: "^GSPC"

  # ハイテク株の温度感。AI 関連の地合いがここに出る
  - name: NASDAQ
    symbol: "^IXIC"

  - name: USD/JPY
    symbol: "USDJPY=X"

  # 為替と株の裏側。ここが動くと他が全部動く。単位は % なので桁区切りは不要
  - name: 米10年債
    symbol: "^TNX"

  # 円建て。桁が大きいので小数は落とす
  - name: ビットコイン
    symbol: "BTC-JPY"
    decimals: 0

  # ─────────────────────────────────────────────────────────────────────
  # 国内の投資信託は Yahoo Finance からは取れないので、運用会社が公開している
  # API を直接読みます。オルカン（eMAXIS Slim 全世界株式）の運用会社は
  # 三菱UFJアセットマネジメントで、登録不要の投信情報 API を出しています。
  #
  #   https://developer.am.mufg.jp/fund_information_latest/fund_cd/253425
  #
  # fund_cd はファンドページの URL に入っている番号です。
  #   https://emaxis.am.mufg.jp/fund/253425.html  →  253425
  #
  # ⚠ このコードは 2026-08-16 時点で未検証です。確認してください:
  #       python3 -m collectors.market --check
  #
  #   NG（HTTP 404）なら fund_cd が違います。協会コード 0331418A も試す価値あり。
  #   NG（NO DATA）なら JSON のキー名が想定と違います。--check が生の JSON の
  #   先頭を出すので、それを見て collectors/market.py の NAV_KEYS を直します。
  # ─────────────────────────────────────────────────────────────────────
  - name: オルカン
    source: fund
    fund_cd: "253425"
    decimals: 0

  # 2026-08-14 に無効化。日経平均とほぼ同じ方向に動くため、朝の一覧で
  # 両方を並べる意味が薄いと判断した。日本株全体の指標としては
  # TOPIX の方が正確なので、必要になったら enabled を外して復活させること。
  # なお記号は未検証。NG なら "^TOPX" / "998405.T" / "1306.T"（ETF）を順に試す
  - name: TOPIX
    symbol: "^TPX"
    enabled: false
